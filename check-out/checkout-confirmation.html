<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Breath Inc. checkout confirmation page with transaction details and return home action.">
    <title>Order Confirmation — Breath Inc.</title>

    <link rel="stylesheet" href="../main-styles.css">
    <link rel="stylesheet" href="checkout-confirmation.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <a class="skip-link" href="#confirmationMain">Skip to confirmation</a>

    <div class="navbar" aria-label="Main site navigation">
        <div class="logo">Breath Inc.</div>

        <div class="nav-links">
            <div class="dropdown">
                <button type="button" class="dropdown-toggle" aria-expanded="false">
                    Go to<i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
                </button>

                <div class="dropdown-menu">
                    <a href="../customer-service/customer-service.html#contact">
                        <i class="fa-solid fa-envelope" aria-hidden="true"></i> Contact Us
                    </a>
                    <a href="../customer-service/customer-service.html#shipping">
                        <i class="fa-solid fa-truck" aria-hidden="true"></i> Shipping &amp; Returns
                    </a>
                    <a href="../customer-service/customer-service.html#faq">
                        <i class="fa-solid fa-circle-question" aria-hidden="true"></i> FAQ
                    </a>
                    <a href="../customer-service/customer-service.html#track">
                        <i class="fa-solid fa-box" aria-hidden="true"></i> Track Order
                    </a>
                </div>
            </div>

            <a href="../view-cart/view-cart.html" class="cart-link" aria-label="View cart, 0 items">
                <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
                <span class="cart-count" id="cartCount">0</span>
            </a>
        </div>
    </div>

    <main id="confirmationMain" class="confirmation-page" aria-labelledby="confirmationTitle">
        <div class="confirmation-card" role="status" aria-live="polite" aria-atomic="true">
            <div class="confirmation-icon" aria-hidden="true">
                <i class="fa-solid fa-circle-check"></i>
            </div>

            <p class="transaction-label">Transaction ID</p>
            <p id="transactionId" class="transaction-id">Loading...</p>

            <h1 id="confirmationTitle">Thank you for shopping</h1>
            <p class="confirmation-copy">Your order has been placed successfully and a confirmation has been sent to your email.</p>

            <button type="button" id="returnHomeBtn" class="home-button">
                Back to Homepage
            </button>
        </div>
    </main>

    <script src="../javascript_main/navbar-script.js"></script>
    <script src="../javascript_main/checkout-confirmation.js"></script>
</body>
</html>
